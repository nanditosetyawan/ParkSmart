<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ParkSmart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ParkSmart</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect Google Fonts untuk mencegah TypeError: Failed to fetch di Web/Chrome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .loading-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .brand-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #1A73E8, #0EA5E9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(26, 115, 232, 0.45);
      animation: badgePulse 1.6s ease-in-out infinite;
    }
    .brand-badge svg {
      width: 32px;
      height: 32px;
      fill: white;
    }
    .brand-title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .brand-subtitle {
      color: #94A3B8;
      font-size: 13px;
      margin-top: -6px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin-top: 8px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="app-loading-indicator" class="loading-box">
    <div class="brand-badge">
      <svg viewBox="0 0 24 24"><path d="M7 3h6a5 5 0 0 1 0 10H10v8H7V3zm3 3v4h3a2 2 0 0 0 0-4h-3z"/></svg>
    </div>
    <div class="brand-title">ParkSmart ID</div>
    <div class="brand-subtitle">Memuat sistem parkir pintar...</div>
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.startSpeechRecognition = function() {
      return new Promise((resolve, reject) => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          reject('Browser tidak mendukung Speech Recognition');
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'id-ID';
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        
        recognition.onresult = (event) => {
          if (event.results && event.results.length > 0) {
            resolve(event.results[0][0].transcript);
          } else {
            resolve('');
          }
        };
        recognition.onerror = (event) => {
          reject(event.error);
        };
        recognition.onnomatch = () => {
          resolve('');
        };
        recognition.start();
      });
    };
  </script>
</body>
</html>
