name: smart_parking
description: ParkSmart - Seamless Parking Mobile App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  google_fonts: ^8.2.1
  local_auth: ^3.0.2
  sensors_plus: ^7.1.1
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  permission_handler: 11.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
